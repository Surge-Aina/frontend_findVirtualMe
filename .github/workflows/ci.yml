name: CI (frontend)

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  build-frontend:
    name: build-frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Configure env for build
        run: |
          echo "VITE_BACKEND_API=${{ vars.VITE_BACKEND_API }}" >> .env

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: fe-dist
          path: dist

  cypress-e2e:
    name: cypress-e2e
    runs-on: ubuntu-latest
    needs: build-frontend
    env:
      CI: "true"
      CYPRESS_baseUrl: http://127.0.0.1:4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Configure env for app
        run: |
          echo "VITE_BACKEND_API=${{ vars.VITE_BACKEND_API }}" >> .env

      - name: Build app
        run: npm run build

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          start: npm run preview -- --host 0.0.0.0 --port 4173
          wait-on: http://127.0.0.1:4173
          wait-on-timeout: 120