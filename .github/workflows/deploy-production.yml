name: Deploy (production - frontend)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) for audit only"
        required: true
        default: "main"

concurrency:
  group: deploy-production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-frontend-production
    runs-on: ubuntu-latest
    environment:
      name: production_cicd          # <-- your prod env name
      url: ${{ vars.FRONTEND_URL }}  # optional link in the UI

    steps:
      # (Audit only) Checkout the ref you selected
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Trigger Vercel production deploy via Deploy Hook
      - name: Trigger Vercel deploy (production)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Missing secret VERCEL_DEPLOY_HOOK in the production_cicd environment."; exit 1
          fi
          echo "Calling Vercel production deploy hook…"
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Deploy triggered."

      # Optional: wait until the site is live
      - name: Wait for site to become available (optional)
        if: ${{ vars.FRONTEND_URL != '' }}
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          echo "Pinging $FRONTEND_URL ..."
          for i in {1..60}; do
            if curl -fsS -o /dev/null -w "%{http_code}" "$FRONTEND_URL" | grep -qE '200|301|302'; then
              echo "Site is live ✅"; exit 0
            fi
            sleep 5
          done
          echo "Site did not become available in time ❌"; exit 1

      - name: Mark deployment success
        run: echo "Production deploy complete"
