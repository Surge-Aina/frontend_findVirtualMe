name: Deploy (staging - frontend)
#TESTING CICD
on:
  workflow_run:
    workflows: ["CI (frontend)"]
    types: [completed]

concurrency:
  group: deploy-staging-frontend
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'staging'
      }}
    name: deploy-frontend-staging
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Vercel deploy (staging)
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Missing secret VERCEL_DEPLOY_HOOK in the staging environment."; exit 1
          fi
          echo "Calling Vercel deploy hook…"
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Deploy triggered."

      - name: Wait for site to become available (optional)
        if: ${{ vars.FRONTEND_URL != '' }}
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          echo "Pinging $FRONTEND_URL ..."
          for i in {1..40}; do
            if curl -fsS -o /dev/null -w "%{http_code}" "$FRONTEND_URL" | grep -qE '200|301|302'; then
              echo "Site is live ✅"; exit 0
            fi
            sleep 5
          done
          echo "Site did not become available in time ❌"; exit 1

      - name: Mark deployment success
        run: echo "Staging deploy complete"